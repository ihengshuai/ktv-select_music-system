# 提供系统数据库相关容器

version: '3.3'

name: ktv-system-db

services:
  mysql: # mongodb 用来存储翻译表
    image: mysql:latest
    container_name: ktv-system-db_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456 # 默认root密码
      TZ: Asia/Shanghai
    ports:
      - 3328:3306 # 自定义端口映射
    restart: "no"
    volumes:
      - ./.db/mysql:/var/lib/mysql
    networks:
      - ktv-system-db_network

networks:
  ktv-system-db_network:
